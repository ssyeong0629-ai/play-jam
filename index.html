<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141414"><title>PLAY JAM — Sound poster</title><meta name="description" content="모양과 소리로 만드는 나만의 사운드 포스터"><link rel="icon" href="assets/icons/icon-10.svg"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/editor.css"></head>
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "zcrpqz8ze9");
</script>
  <body>
<header class="topbar"><a class="brand" href="#" aria-label="PLAY JAM 홈"><span></span>PLAY JAM</a>
<div class="transport" aria-label="재생 도구"><button id="play" class="light-button" title="재생 / 일시정지 (Space)" aria-label="재생">▶</button><button id="restart" title="처음부터" aria-label="처음부터">↤</button><button id="repeat" title="전체 반복" aria-label="반복 재생" aria-pressed="false">↻</button><label class="tempo"><button id="bpm-down" aria-label="BPM 줄이기">−</button><input id="bpm" type="number" min="40" max="220" value="100" aria-label="BPM"><span>BPM</span><button id="bpm-up" aria-label="BPM 늘리기">+</button></label><span id="time" class="muted">00:00</span></div>
<div class="top-end"><button id="theme" aria-label="라이트 테마로 전환">◐</button><button id="share" aria-haspopup="dialog">Export ↗</button></div></header>
<aside id="palette-panel" class="palette-panel" aria-label="아이콘 팔레트"><div class="palette-heading"><span>Library</span><div class="mobile-controls"><button id="minimize" aria-label="팔레트 최소화">⌄</button><button id="close-palette" aria-label="팔레트 닫기">×</button></div></div><button id="random" class="random" aria-pressed="true"><span aria-hidden="true">⚄</span> Random</button><div id="palette" class="palette" role="toolbar" aria-label="아이콘 36개, 방향키로 선택"></div><div id="source-info" class="source-info">랜덤 · 놓을 때마다 새로운 소리</div><button id="snap" class="wide" aria-pressed="false">박자에 맞추기 <span>OFF</span></button><div class="history"><button id="undo" title="실행 취소 (⌘Z)">↶ Undo</button><button id="redo" title="다시 실행 (⌘⇧Z)">↷ Redo</button></div><details id="shortcuts"><summary>Shortcuts</summary><dl><dt>Space</dt><dd>재생 / 일시정지</dd><dt>Enter</dt><dd>기호 추가</dd><dt>방향키</dt><dd>선택 기호 이동</dd><dt>− / +</dt><dd>크기 조절</dd><dt>[ / ]</dt><dd>회전</dd><dt>Delete</dt><dd>효과부터 삭제</dd><dt>Esc</dt><dd>선택 해제</dd><dt>⌘Z / ⌘⇧Z</dt><dd>실행 취소 / 다시 실행</dd></dl><p>Shift를 함께 누르면 크게 조절해요.<br>Windows는 ⌘ 대신 Ctrl을 사용하세요.</p></details><div class="file-tools"><button id="load">Open project</button><button id="new">New</button></div><input type="file" id="load-file" accept=".json,application/json" hidden><span class="local-status" id="save-status">이 기기에 자동 저장</span></aside>
<main class="workspace"><div class="canvas-toolbar"><div class="staff-tools"><button id="remove-row" title="단 삭제" aria-label="단 삭제">−</button><span id="row-count" class="muted">3단</span><button id="add-row" title="단 추가" aria-label="단 추가">+</button></div><button id="delete-note" disabled title="효과부터 삭제 (Delete)">Delete</button><div class="zoom-tools"><button id="zoom-out" aria-label="축소">−</button><button id="zoom-label" title="너비 맞춤">100%</button><button id="zoom-in" aria-label="확대">+</button><button id="fit">Fit page</button></div></div><div id="viewport" class="viewport"><div id="poster-wrap"><div id="poster" class="poster" tabindex="0" aria-label="포스터 편집 영역"></div></div></div><footer class="workspace-footer"><div id="page-nav"><button id="prev-page" aria-label="이전 페이지">‹</button><span id="page-count">1 / 1</span><button id="next-page" aria-label="다음 페이지">›</button></div><span id="hint">기호 선택 · 드래그로 이동 · 빈 곳을 누르면 선택 해제</span></footer></main>
<div id="mobile-dock"><button id="open-palette">⌃ Library</button><button id="dock-random">Random</button><button id="dock-current" title="선택한 기호 추가">+ Place</button></div>
<dialog id="export-dialog"><div class="dialog-heading"><h2>Export</h2><button data-close aria-label="닫기">×</button></div><label class="check"><input id="include-lines" type="checkbox" checked> 네온 연결선 포함</label><label class="check"><input id="all-pages" type="checkbox"> 모든 페이지 저장</label><div class="export-options"><button id="save-png">PNG <span>A4 poster</span></button><button id="save-pdf">PDF <span>Print ready</span></button><button id="save-wallpaper">Wallpaper <span>9:16 · 전체 포스터 맞춤</span></button><button id="save-json">Project <span>나중에 다시 편집 · JSON</span></button><button id="copy-link">Share link <span>소리와 배치 함께 공유</span></button><button id="record">Video loop <span>브라우저 지원 형식으로 녹화</span></button></div><p id="export-status" class="muted" role="status"></p><input id="link-output" aria-label="Share link" readonly hidden></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div><script src="js/icons.js"></script><script src="js/audio.js"></script><script src="js/editor.js"></script><script src="js/export.js"></script><script src="js/onboarding.js"></script></body></html>
