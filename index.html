<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLAY JAM</title><link rel="stylesheet" href="css/app.css"><script type="text/javascript">
(function(c,l,a,r,i,t,y){
c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
})(window,document,"clarity","script","zcrpqz8ze9");
</script></head><body>
<header class="global"><a class="brand" href="#" aria-label="PLAY JAM 홈"><span>♪</span> PLAY JAM</a><div class="transport"><button id="play" aria-label="재생">▶</button><button id="restart" aria-label="처음부터 재생">↤</button><button id="loop" aria-label="반복 재생" aria-pressed="false">↻</button><label><button id="slower" aria-label="속도 줄이기">−</button><input id="bpm" type="number" min="40" max="220" value="100" aria-label="BPM"> BPM <button id="faster" aria-label="속도 높이기">+</button></label><time id="time">00:00</time></div><div class="global-end"><button id="help" aria-label="사용법 다시 보기">?</button><button id="theme" aria-label="테마 전환">◐</button><button id="share" aria-label="공유 및 내보내기" aria-expanded="false">↥</button></div></header>
<main><aside id="sidebar"><h2>Library</h2><div id="palette" role="toolbar" aria-label="6색 악기 아이콘"></div><div class="decoration-examples" aria-hidden="true"><span>○</span><span>△</span><span>□</span><span>∿</span><span>✧</span><span>◎</span></div><label class="density"><span>MIN</span><input id="density" type="range" min="0" max="100" value="50" aria-label="장식 밀도"><span>MAX</span></label></aside><section class="workspace"><div class="workspace-header"><button id="collapse" aria-label="사이드바 접기" aria-expanded="true">☰</button><button id="undo" aria-label="실행 취소">↶</button><button id="redo" aria-label="다시 실행">↷</button><button id="delete-mode" aria-label="삭제 모드" aria-pressed="false" title="켜고 아이콘을 누르면 삭제">Delete</button><div class="zoom"><button id="out" aria-label="축소">−</button><button id="percent" aria-label="기본 크기">100%</button><button id="in" aria-label="확대">+</button><button id="fit" aria-label="화면 맞춤">⛶</button></div></div><div id="viewport"><div id="sizer"><div id="pages" tabindex="0" aria-label="그래픽 악보 편집"></div></div></div></section></main>
<div id="radial" hidden><div id="radial-options"></div><button id="radial-current" aria-label="아이콘 팔레트 열기" aria-expanded="false"></button></div>
<div id="export-menu" hidden><button id="png">PNG ↓</button><label><input type="checkbox" id="all-pages"> 모든 페이지</label><button id="copy">공유 링크 ↗</button><input id="link" readonly hidden aria-label="공유 링크"></div><div id="toast" role="status" hidden></div>
<dialog id="welcome"><div><span class="wordmark">♪ PLAY JAM</span><h1>모양을 놓고,<br>합주를 그려요.</h1><p>나만의 그래픽 악보</p><button id="start" class="primary">START ↗</button><button id="skip-start">바로 시작하기</button></div><div id="intro-art" aria-hidden="true"></div></dialog>
<dialog id="tour"><span id="step"></span><h2></h2><p></p><nav><button id="skip-tour">건너뛰기</button><button id="prev-tour">이전</button><button id="next-tour">다음 →</button></nav></dialog>
<script src="js/icons.js"></script><script src="assets/audio/bank.js"></script><script src="js/audio.js"></script><script src="js/model.js"></script><script src="js/app.js"></script></body></html>
