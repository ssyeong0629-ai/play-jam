<!doctype html><html lang="ko"><meta charset="utf-8"><title>PLAY JAM audio validation</title><h1>음원 검사</h1><pre id="result">검사 중…</pre><script src="../assets/audio/bank.js"></script><script src="../js/audio.js"></script><script>
(async()=>{const A=JamAudio,out=document.getElementById('result'),errors=[];const decoder=new OfflineAudioContext(1,32000,32000);for(const [id,s] of Object.entries(JAM_AUDIO_SAMPLES)){const bytes=Uint8Array.from(atob(s.data.split(',')[1]),c=>c.charCodeAt(0));const b=await decoder.decodeAudioData(bytes.buffer);if(Math.abs(b.duration-s.duration)>.002)errors.push(id+': duration mismatch');A.buffers.set(id,b);}let renders=0;for(const icon of Object.keys(JAM_AUDIO_BANK))for(const y of [0,6,12]){const n={icon,y};const duration=A.duration(n,100),ctx=new OfflineAudioContext(1,Math.ceil((duration+.15)*32000),32000);A.ctx=ctx;A.master=ctx.createGain();A.master.gain.value=.32;A.master.connect(ctx.destination);A.note(n,0,100);const b=await ctx.startRendering(),data=b.getChannelData(0);let peak=0,last=0;for(let i=0;i<data.length;i++){if(!Number.isFinite(data[i]))errors.push(icon+': nonfinite');peak=Math.max(peak,Math.abs(data[i]));if(Math.abs(data[i])>.00001)last=i/32000;}if(peak<.0001)errors.push(icon+'/'+y+': silent');if(last>duration+.003)errors.push(icon+': tail after stop');renders++;}out.textContent=JSON.stringify({status:errors.length?'FAIL':'PASS',decodedSamples:A.buffers.size,renderedVoices:renders,errors},null,2);})().catch(e=>document.getElementById('result').textContent='FAIL '+e.stack);
</script></html>
