<!doctype html><html lang="ko"><meta charset="utf-8"><title>PLAY JAM export validation</title><h1>공유·이미지 검사</h1><pre id="result">검사 중…</pre><iframe id="editor" width="1000" height="650"></iframe><script>
const fixture={version:3,title:'한글 공유 검사',artist:'PLAY JAM',date:'2026-11-13',bpm:123,density:78,theme:'light',loop:false,notes:Array.from({length:36},(_,i)=>({id:'test'+i,icon:Math.floor(i/6)+'-'+i%6,row:i<18?Math.floor(i/6):7+Math.floor((i-18)/6),x:.08+(i%6)*.16,y:i%13}))};let str='';for(const b of new TextEncoder().encode(JSON.stringify(fixture)))str+=String.fromCharCode(b);const f=document.getElementById('editor');f.onload=async()=>{try{const w=f.contentWindow;if(!w.Jam)return;const restored=w.Jam.state;if(JSON.stringify(restored)!==JSON.stringify(fixture))throw Error('share state mismatch');let bytes=[];for(let p=0;p<2;p++){const url=URL.createObjectURL(new Blob([w.Jam.svgPage(p)],{type:'image/svg+xml'})),img=new Image();img.src=url;await img.decode();const c=document.createElement('canvas');c.width=1588;c.height=2246;c.getContext('2d').drawImage(img,0,0,c.width,c.height);const blob=await new Promise(r=>c.toBlob(r,'image/png'));URL.revokeObjectURL(url);if(!blob||blob.size<5000)throw Error('PNG empty');bytes.push(blob.size);}document.getElementById('result').textContent=JSON.stringify({status:'PASS',sharedIcons:restored.notes.length,pages:w.document.querySelectorAll('.poster').length,pngBytes:bytes,downloadAttempted:false},null,2);}catch(e){document.getElementById('result').textContent='FAIL '+e.stack;}};f.src='../index.html#jam='+btoa(str).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
</script></html>
